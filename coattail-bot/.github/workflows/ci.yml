name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter
        run: ruff check src tests

      - name: Tests
        run: pytest tests -q

      # Der Durchlauf ohne Netz und ohne Zugangsdaten. Faengt genau die Fehler,
      # die Unit-Tests nicht sehen: Verdrahtung, Migrationen, CLI-Argumente.
      - name: Durchlauf ohne Netz
        env:
          COATTAIL_SYNTHETIC_PRICES: "1"
        run: |
          coattail doctor
          coattail bootstrap
          coattail set-override "Dana Solid" allow
          coattail score
          coattail run-once
          coattail signals
