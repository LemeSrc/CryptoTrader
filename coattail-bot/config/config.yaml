# Coattail: Strategie und Betrieb. Geheimnisse gehoeren in .env, nicht hierher.
#
# Voreinstellung: echte Daten, Papierhandel. Der Bot holt echte Meldungen und
# Posts, bewertet echte Personen und fuehrt ein simuliertes Depot mit echten
# Kursen, Schlupf und Gebuehren. Echtes Geld fliesst erst, wenn mode auf live
# steht und ein Broker hinterlegt ist. Das kommt fruehestens nach mehreren
# Wochen Papierhandel mit positivem Ergebnis, siehe docs/AUTOMATION.md.

timezone: Europe/Berlin
database_url: sqlite:///data/coattail.db
log_level: INFO

execution:
  mode: paper            # dry_run | paper | live
  broker: paper          # paper | alpaca | ccxt
  exchange_id: binance
  alpaca_paper: true
  order_type: market
  limit_offset_bps: 10
  max_signal_age_minutes: 4320   # drei Tage. Deckt ein Wochenende ab, aeltere Meldungen sind kalt.
  max_slippage_bps: 40
  trading_hours_only: true
  allow_short: false
  allow_options: false
  fractional_shares: true

risk:
  equity_base: 10000
  risk_per_trade_pct: 0.5        # Verlust bei Stop, in Prozent des Kapitals
  max_position_pct: 5
  max_ticker_exposure_pct: 8     # Deckel ueber alle Vorbilder hinweg
  max_sector_exposure_pct: 25
  max_open_positions: 20
  max_gross_exposure_pct: 80
  daily_loss_limit_pct: 3
  max_drawdown_pct: 12
  default_stop_atr_mult: 2.5
  default_take_profit_r: 3
  min_order_notional: 25
  require_stop_for_leverage: true

scoring:
  min_trades: 12                 # weniger ist Zufall, nicht Koennen
  min_score: 55
  min_win_rate: 0.45
  max_disclosure_lag_days: 45    # wer spaeter meldet, ist nicht kopierbar
  lookback_days: 1095
  horizons_days: [21, 63, 126]
  benchmark: SPY
  prior_win_rate: 0.5
  prior_weight: 20               # Staerke der Schrumpfung bei kleiner Stichprobe
  recency_halflife_days: 365
  rescore_interval_hours: 24
  weights:
    win_rate: 0.30
    expectancy: 0.25
    profit_factor: 0.15
    consistency: 0.10
    risk_discipline: 0.10
    freshness: 0.10

notify:
  telegram_enabled: false
  notify_on: [order, rejection, kill_switch, daily_summary]
  daily_summary_hour_utc: 21

# Titel, die nie gehandelt werden. Sinnvoll fuer alles, was zu duenn gehandelt
# wird, um eine Order ohne Kurssprung aufzunehmen.
ticker_blocklist: []
# Wenn gefuellt, wird ausschliesslich hieraus gehandelt.
ticker_allowlist: []

sources:
  # ---------------------------------------------------------------- Demo
  # Nur fuer den ersten Trockenlauf. Nie zusammen mit echten Quellen, die
  # erfundenen Personen wuerden echte Signale ausloesen.
  - name: demo
    kind: demo
    enabled: false
    poll_seconds: 86400
    options:
      seed: 7
      history_days: 540
      trades_per_actor: 40

  # ------------------------------------------------- Kongress, kostenlos
  # Amtliche Pflichtmeldungen beider Kammern. Die Rohdaten kommen vom House
  # Clerk und vom Senate eFD. Weil das Haus nur PDFs veroeffentlicht und die
  # Senatsseite Zugriffe von ausserhalb der USA sperrt, liest der Bot einen
  # oeffentlichen Tagesspiegel auf GitHub, der beides aufbereitet (jede Zeile
  # verweist auf das Originaldokument). Aktualisiert taeglich gegen 15:30
  # deutscher Zeit, oefter abfragen bringt nichts.
  - name: house_ptr
    kind: house_ptr
    enabled: true
    poll_seconds: 10800     # alle drei Stunden
    options:
      relist_days: 14       # spaet gespiegelte Meldungen noch mitnehmen

  - name: senate_ptr
    kind: senate_ptr
    enabled: true
    poll_seconds: 10800
    options:
      relist_days: 14

  # Vom Server aus gesperrt: das Backend antwortet mit 503, die Webseite
  # mit einer Bot-Pruefung (429). Bleibt drin, falls sich das aendert.
  - name: capitoltrades
    kind: capitoltrades
    enabled: false
    poll_seconds: 1800
    options:
      mode: auto
      pages: 3
      history_pages: 150
      page_size: 100

  - name: stockwatcher
    kind: stockwatcher
    enabled: false          # Buckets antworten im September 2026 mit 403
    poll_seconds: 21600
    options:
      include_senate: true

  # ------------------------------------------- Kongress, mit Zugangsdaten
  - name: quiver
    kind: quiver
    enabled: false          # schnellster Feed, kostet ein Abo. Zweite Quelle, sobald es sich lohnt.
    poll_seconds: 600
    options:
      endpoint: /live/congresstrading

  - name: finnhub
    kind: finnhub
    enabled: false
    poll_seconds: 3600
    options:
      symbols: [NVDA, MSFT, AAPL, LMT, XOM]

  - name: fmp
    kind: fmp
    enabled: false
    poll_seconds: 1800
    options:
      pages: 2

  # ------------------------------------------------ Insider, sehr schnell
  - name: sec_form4
    kind: sec_form4
    enabled: true           # Form 4 kommt binnen zwei Tagen statt 45. Braucht COATTAIL_CONTACT.
    poll_seconds: 900
    options:
      count: 100
      max_pages: 8          # bis zu 400 Meldungen pro Abruf, reicht auch abends
      min_value_usd: 250000
      only_buys: true

  - name: sec_13f
    kind: sec_13f
    enabled: false
    poll_seconds: 86400
    options:
      ciks: []              # zum Beispiel 1067983 fuer Berkshire Hathaway

  # ------------------------------------------------------- Trader kopieren
  - name: hyperliquid
    kind: hyperliquid
    enabled: false          # Fills direkt von der Kette, kein Konto noetig
    poll_seconds: 120
    options:
      wallets: []
        # - address: "0x0000000000000000000000000000000000000000"
        #   label: "Wallet eines Invo-Traders"

  - name: invo
    kind: invo
    enabled: false
    poll_seconds: 300
    options:
      mode: chain           # chain | api | cookie
      wallets: []
      follow: []
      base_url: https://app.invoapp.com/api
      trades_path: /users/{user}/trades
      asset_class: crypto

  - name: leaderboard
    kind: leaderboard
    enabled: false          # Bausatz fuer beliebige JSON-Ranglisten
    poll_seconds: 600
    options:
      url: ""
      root: data
      label: custom
      map:
        symbol: symbol
        side: side
        time: timestamp
        actor_id: trader.id
        actor_name: trader.name
        price: price
        quantity: size
        stop_loss: stopLoss

  # ------------------------------------------------------- Posts und Politik
  # Truth Social direkt, ueber die Mastodon-kompatible Schnittstelle. Vom
  # Hetzner-Server aus mit 403 gesperrt (Cloudflare). Dieselben Beitraege
  # kommen ueber das RSS-Archiv weiter unten, deshalb aus.
  - name: truthsocial
    kind: mastodon
    enabled: false
    poll_seconds: 120
    options:
      base_url: https://truthsocial.com
      accounts:
        - {handle: realDonaldTrump}
      limit: 20

  - name: bluesky
    kind: bluesky
    enabled: true           # offene Schnittstelle, kostenlos
    poll_seconds: 180
    options:
      # Nach dem Start mit 'coattail probe --source bluesky' pruefen.
      # Wer nichts liefert, fliegt raus. Weitere Konten einfach ergaenzen.
      handles:
        - fetterman.senate.gov
        - booker.senate.gov
        - schiff.senate.gov
        - aoc.bsky.social
      limit: 30

  # X kostet seit 2026 pro gelesenem Post, ein Gratiskontingent gibt es fuer
  # neue Entwickler nicht mehr. Bei fuenf Konten und normalem Posting-Tempo
  # bleiben das ein paar Dollar im Monat, trotzdem erst einschalten, wenn der
  # Papierhandel zeigt, dass Posts ueberhaupt etwas bringen.
  # Einrichten: developer.x.com, App anlegen, Bearer Token in .env als
  # X_BEARER_TOKEN, dann enabled auf true.
  - name: x
    kind: x
    enabled: false
    poll_seconds: 300
    options:
      users:
        - realDonaldTrump
        - elonmusk
        - WhiteHouse
      limit: 10             # Obergrenze pro Konto und Abruf, haelt die Kosten klein
      first_run_hours: 6

  - name: rss
    kind: rss
    enabled: true
    poll_seconds: 300
    options:
      feeds:
        - {url: "https://www.whitehouse.gov/presidential-actions/feed/", label: "Weisses Haus"}
        # Oeffentliches Archiv der Truth-Social-Beitraege von Donald Trump
        - {url: "https://trumpstruth.org/feed", label: "realDonaldTrump"}

  - name: federal_register
    kind: federal_register
    enabled: true           # Verfuegungen, oft vor der Nachrichtenlage
    poll_seconds: 1800
    options:
      types: [PRESDOCU]
      per_page: 50

  - name: usaspending
    kind: usaspending
    enabled: true           # Grossauftraege des Bundes
    poll_seconds: 21600
    options:
      min_amount: 100000000
      limit: 50

  # Keine Datenquelle, sondern der Schalter fuer die Post-Auswertung.
  # Ohne ANTHROPIC_API_KEY laeuft nur die Regelstufe, die ist kostenlos und
  # vorsichtig. Mit Schluessel kommt die Modellstufe dazu.
  - name: posts_to_signals
    kind: none
    enabled: true
    options:
      use_llm: true
      model: claude-sonnet-5   # claude-haiku-4-5 ist guenstiger, claude-opus-5-5 gruendlicher
      min_conviction: 0.6
      max_age_minutes: 120
      post_actor_score: 60
      authors: []            # leer heisst: alle beobachteten Konten
