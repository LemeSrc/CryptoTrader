[project]
name = "coattail"
version = "0.1.0"
description = "Copy-Trading-Bot fuer Kongress-Disclosures, Politiker-Posts und verifizierte Top-Trader"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "APScheduler>=3.10",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=8.3",
  "python-dateutil>=2.9",
  "feedparser>=6.0",
  "selectolax>=0.3.21",
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
brokers = ["alpaca-py>=0.21", "ccxt>=4.3"]
llm = ["anthropic>=0.34"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
coattail = "coattail.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
